<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FreshMart & Kitchen</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="/">🥬 FreshMart & Kitchen</a>
            <div class="d-flex gap-2">
                <a href="/admin" class="btn btn-outline-light btn-sm align-self-center">Owner Admin</a>
                <a href="/cart" class="btn btn-warning fw-semibold">🛒 Cart</a>
            </div>
        </div>
    </nav>

    <!-- Category Filter Bar -->
    <div class="container my-4">
        <div class="d-flex gap-2 flex-wrap mb-4">
            <a href="/" class="btn btn-sm {{ 'btn-success' if not current_cat else 'btn-outline-secondary' }}">All Items</a>
            {% for cat in categories %}
            <a href="/?category={{ cat }}" class="btn btn-sm {{ 'btn-success' if current_cat == cat else 'btn-outline-secondary' }}">{{ cat }}</a>
            {% endfor %}
        </div>

        <!-- Product Grid -->
        <div class="row row-cols-1 row-cols-md-3 g-4">
            {% for product in products %}
            <div class="col">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body">
                        <span class="badge bg-secondary mb-2">{{ product.category }}</span>
                        <h5 class="card-title fw-bold">{{ product.name }}</h5>
                        <p class="text-muted mb-1">Unit: {{ product.unit }}</p>
                        <h4 class="text-success fw-bold">₹{{ product.price }}</h4>
                    </div>
                    <div class="card-footer bg-white border-0 pt-0">
                        <a href="/cart/add/{{ product.id }}" class="btn btn-success w-100">+ Add to Cart</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
